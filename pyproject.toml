[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otdq-eval"
version = "0.1.0"
description = "Anonymous OTDQ-Eval toolkit for no-clear-reference dehazing quality assessment."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "pillow>=9.0",
  "matplotlib>=3.6",
  "tabulate>=0.9"
]

[tool.setuptools.packages.find]
include = ["otdq_eval*"]
